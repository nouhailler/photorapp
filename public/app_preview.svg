      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0" y1="0" x2="280" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
