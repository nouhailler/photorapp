<svg width="640" height="160" viewBox="0 0 640 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#1E35D0"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="accentSpark" x1="100" y1="20" x2="140" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="shadow" x="10" y="10" width="140" height="140" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E35D0" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="120" height="120" rx="32" fill="url(#logoGrad)"/>
    
    <!-- Camera Body / Lens Geometry -->
    <rect x="42" y="46" width="76" height="66" rx="18" fill="white" fill-opacity="0.95"/>
    <circle cx="80" cy="79" r="22" fill="#1E35D0"/>
    <circle cx="80" cy="79" r="14" fill="#0F172A"/>
    <circle cx="85" cy="74" r="5" fill="#38BDF8"/>
    
    <!-- Flash bump / viewfinder -->
    <path d="M64 46L68 38H92L96 46H64Z" fill="white" fill-opacity="0.95"/>
    <circle cx="104" cy="56" r="3.5" fill="#EF4444"/>
    
    <!-- AI Intelligence Sparkle Star -->
    <path d="M124 24C124 33 131 40 140 40C131 40 124 47 124 56C124 47 117 40 108 40C117 40 124 33 124 24Z" fill="url(#accentSpark)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(165, 0)">
    <text x="0" y="76" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#0F172A" letter-spacing="-1.5">
      Gallery<tspan fill="#1E35D0">Pro</tspan>
    </text>
    <rect x="235" y="44" width="60" height="24" rx="12" fill="#EEF2FF"/>
    <text x="265" y="60" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#4338CA" text-anchor="middle">v2.4</text>
    
    <!-- Tagline & Core value -->
    <text x="2" y="105" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#64748B" letter-spacing="0.2">
      YOUR VISUAL LEGACY • 100% LOCAL-FIRST &amp; PRIVÉ
    </text>
    <text x="2" y="126" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">
      Photothèque intelligente, moteur de recherche sémantique &amp; PWA
    </text>
  </g>
</svg>
